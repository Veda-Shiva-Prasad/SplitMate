version: "3.8"

services:
  server:
    build: ./server
    container_name: splitmate-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
    networks:
      - splitmate-net

  client:
    build: ./client
    container_name: splitmate-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - splitmate-net

networks:
  splitmate-net:
    driver: bridge
